<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b10" />
  <title>Vipeak Live · AI 陪伴</title>
  <link rel="icon" href="/assets/brand/favicon.svg" />
  <link rel="stylesheet" href="/live.css?v=live-v2" />
</head>
<body><div id="liveApp" class="live-device" aria-live="polite"></div>
  <dialog id="loginDialog" class="login-dialog"><form method="dialog" class="login-card" data-login-form>
    <button class="dialog-close" value="cancel" aria-label="关闭">×</button><span class="eyebrow">VIPEAK LIVE</span>
    <h2>登录后进入直播间</h2><p>账号在各站点通用，登录一次即可继续。</p>
    <label>用户名<input name="username" autocomplete="username" required /></label><label>密码<input name="password" type="password" autocomplete="current-password" minlength="6" required /></label>
    <div class="form-message" data-login-message></div><button class="primary-button" type="submit">登录 / 注册</button>
  </form></dialog>
  <script src="/chat-live.js?v=chat-live-12" defer></script><script src="/live.js?v=live-v2" defer></script>
</body></html>
