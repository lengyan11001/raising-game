# Keep individual tool results small enough that a few reads cannot fill context.
tool_output_token_limit = 1500

# Count only new context after the carried compaction prefix. Recounting the
# full inherited prefix was causing compaction to trigger repeatedly.
model_auto_compact_token_limit_scope = "body_after_prefix"

# Avoid an additional compaction pass at turn end.
model_post_turn_compact_threshold_percent = 0
