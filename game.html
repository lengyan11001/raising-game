<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Vipeak AI Game</title>
    <link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg?v=old-brand-1" />
    <link rel="shortcut icon" href="/favicon.ico?v=old-brand-1" />
    <link rel="stylesheet" href="./game.css?v=game-4" />
    <script src="./assets/vendor/lucide-1.27.0.min.js"></script>
    <script src="./platform.vitals.js?v=web-vitals-1" defer></script>
  </head>
  <body class="age-gate-locked">
    <script>
      (function () {
        try {
          if (localStorage.getItem("raisingGameAgeGateAccepted") === "1") {
            document.body.classList.add("age-gate-accepted");
            document.body.classList.remove("age-gate-locked");
          }
        } catch (error) {}
      })();
    </script>
    <section id="ageGate" class="age-gate" role="dialog" aria-modal="true" aria-labelledby="ageGateTitle" hidden>
      <div class="age-card">
        <span>18+</span>
        <h1 id="ageGateTitle">Adults only</h1>
        <p>Please confirm you are 18 years of age or older.</p>
        <button id="ageConfirmBtn" type="button">I am 18 or older</button>
        <button id="ageDeclineBtn" type="button">I am under 18</button>
      </div>
    </section>
    <section id="ageForbidden" class="age-gate" hidden>
      <div class="age-card">
        <span>403</span>
        <h1>Access denied</h1>
        <p>Only users aged 18 or older can enter.</p>
      </div>
    </section>

    <main class="game-feed" id="gameFeed">
      <section class="feed-stage" id="feedStage" aria-label="Character video feed">
        <video id="feedVideo" class="feed-video" autoplay muted loop playsinline preload="metadata"></video>
        <img id="feedPoster" class="feed-poster" alt="" />
        <div class="feed-scrim"></div>

        <header class="feed-topbar">
          <div class="feed-wallet">
            <i data-lucide="gem"></i>
            <strong id="creditCount">0</strong>
          </div>
        </header>

        <div class="video-index" id="videoIndex"></div>

        <aside class="feed-actions" aria-label="Actions">
          <button id="playBtn" class="feed-action" type="button" aria-label="Play">
            <i data-lucide="play"></i>
            <span>Play</span>
          </button>
          <button id="unlockBtn" class="feed-action" type="button" hidden aria-label="Unlock">
            <i data-lucide="lock-keyhole"></i>
            <span>Unlock</span>
          </button>
          <button id="undressBtn" class="feed-action" type="button" aria-label="Undress">
            <i data-lucide="wand-sparkles"></i>
            <span>Undress</span>
          </button>
          <button id="replaceBtn" class="feed-action" type="button" aria-label="Replace">
            <i data-lucide="replace"></i>
            <span>Replace</span>
          </button>
          <button id="extendBtn" class="feed-action" type="button" aria-label="Extend">
            <i data-lucide="stretch-horizontal"></i>
            <span>Extend</span>
          </button>
        </aside>

        <section class="character-copy">
          <p id="characterMeta">Swipe up and down to switch characters</p>
          <h1 id="characterName">Loading</h1>
          <div class="tag-row" id="tagRow"></div>
        </section>

        <div class="gesture-hint" aria-hidden="true">
          <span><i data-lucide="chevrons-up-down"></i></span>
          <span><i data-lucide="chevrons-left-right"></i></span>
        </div>
      </section>
    </main>

    <dialog id="confirmDialog" class="game-dialog">
      <form method="dialog">
        <h2 id="confirmTitle">Confirm</h2>
        <p id="confirmText"></p>
        <menu>
          <button value="cancel" type="submit">Cancel</button>
          <button id="confirmActionBtn" value="confirm" type="submit">Confirm</button>
        </menu>
      </form>
    </dialog>

    <dialog id="actionDialog" class="game-dialog action-dialog">
      <form method="dialog">
        <header class="dialog-head">
          <h2 id="actionTitle">Create</h2>
          <button id="actionCloseBtn" value="cancel" type="submit" aria-label="Close"><i data-lucide="x"></i></button>
        </header>
        <div id="actionBody" class="action-body"></div>
        <menu>
          <button value="cancel" type="submit">Cancel</button>
          <button id="actionSubmitBtn" value="confirm" type="submit">Generate</button>
        </menu>
      </form>
    </dialog>

    <dialog id="loginDialog" class="game-dialog action-dialog">
      <form method="dialog">
        <header class="dialog-head">
          <h2>Sign in</h2>
          <button value="cancel" type="submit" aria-label="Close"><i data-lucide="x"></i></button>
        </header>
        <div class="action-body">
          <label class="action-field">
            <span>Username</span>
            <input id="loginUsername" autocomplete="username" />
          </label>
          <label class="action-field">
            <span>Password</span>
            <input id="loginPassword" type="password" autocomplete="current-password" />
          </label>
          <p class="action-status" id="loginStatus"></p>
        </div>
        <menu>
          <button id="loginRegisterBtn" value="register" type="button">Register</button>
          <button id="loginSubmitBtn" value="confirm" type="button">Sign in</button>
        </menu>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./game.js?v=game-7"></script>
  </body>
</html>
